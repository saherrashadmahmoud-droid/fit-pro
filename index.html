<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gym Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .filter-btn.active { background-color: #10b981; color: #000; }
        .img-bg { background-color: #1f2937; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-black/50 backdrop-blur-md sticky top-0 z-10 border-b border-gray-800">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-black text-green-400">ULTIMATE GYM</h1>
            <span class="text-sm text-gray-400 hidden md:block">منصة التمارين والأنظمة المتكاملة</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="text-center py-10 px-4 bg-gradient-to-b from-gray-900 to-gray-800">
        <h2 class="text-3xl md:text-4xl font-bold mb-2">اختر نظامك وتمرن صح</h2>
        <p class="text-gray-400 text-lg">مكتبة شاملة لمئات التمارين بصور توضيحية عالية الجودة</p>
    </section>

    <!-- Filters -->
    <div class="container mx-auto px-4 py-6 flex flex-wrap justify-center gap-3">
        <button onclick="filterExercises('All', this)" class="filter-btn active px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 font-bold transition">الكل</button>
        <span class="text-gray-600 self-center">|</span>
        <button onclick="filterExercises('Push', this)" class="filter-btn px-4 py-2 rounded-lg bg-blue-900 hover:bg-blue-800 font-bold transition">بوش (Push)</button>
        <button onclick="filterExercises('Pull', this)" class="filter-btn px-4 py-2 rounded-lg bg-red-900 hover:bg-red-800 font-bold transition">بول (Pull)</button>
        <button onclick="filterExercises('Legs', this)" class="filter-btn px-4 py-2 rounded-lg bg-purple-900 hover:bg-purple-800 font-bold transition">ليج (Legs)</button>
        <span class="text-gray-600 self-center">|</span>
        <button onclick="filterExercises('barbell', this)" class="filter-btn px-4 py-2 rounded-lg bg-orange-900 hover:bg-orange-800 font-bold transition">بار</button>
        <button onclick="filterExercises('dumbbell', this)" class="filter-btn px-4 py-2 rounded-lg bg-teal-900 hover:bg-teal-800 font-bold transition">دمبل</button>
        <button onclick="filterExercises('machine', this)" class="filter-btn px-4 py-2 rounded-lg bg-indigo-900 hover:bg-indigo-800 font-bold transition">جهاز</button>
        <button onclick="filterExercises('bodyweight', this)" class="filter-btn px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-bold transition">وزن جسم</button>
    </div>

    <!-- Exercises Grid -->
    <div id="exercises-container" class="container mx-auto px-4 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-gray-500 text-xl flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-green-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            جاري تحميل مكتبة التمارين...
        </div>
    </div>

    <footer class="text-center py-6 text-gray-600 border-t border-gray-800">
        <p>© Ultimate Gym Platform - Designed by The Best Coach & Coder</p>
    </footer>

    <script>
        // تحويل أسماء العضلات في قاعدة البيانات لنظام (Push/Pull/Legs)
        const muscleMap = {
            "chest": "Push", "triceps": "Push", "shoulders": "Push",
            "lats": "Pull", "biceps": "Pull", "traps": "Pull", "middle back": "Pull", "upper back": "Pull", "forearms": "Pull",
            "quadriceps": "Legs", "hamstrings": "Legs", "glutes": "Legs", "calves": "Legs", "abductors": "Legs", "adductors": "Legs"
        };

        let allExercises = [];

        async function loadExercises() {
            try {
                // سحب قاعدة بيانات التمارين من سيرفر jsDelivr (آمن ومش بيتحجب أبداً)
                const res = await fetch('https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/dist/exercises.json');
                const data = await res.json();
                
                allExercises = data.map(ex => {
                    const primaryMuscle = ex.primaryMuscles && ex.primaryMuscles.length > 0 ? ex.primaryMuscles[0] : "";
                    const split = muscleMap[primaryMuscle] || "Other";
                    
                    return {
                        name: ex.name,
                        muscle: primaryMuscle,
                        equipment: ex.equipment,
                        split: split,
                        image: ex.images && ex.images.length > 0 ? `https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/${ex.images[0]}` : "",
                        desc: ex.instructions && ex.instructions.length > 0 ? ex.instructions[0] : "لا يوجد شرح متاح."
                    };
                });
                
                renderExercises(allExercises);
            } catch (error) {
                document.getElementById('exercises-container').innerHTML = `<p class="col-span-full text-center text-red-500 text-xl">حدث خطأ في تحميل البيانات. حاول تحديث الصفحة.</p>`;
            }
        }

        const container = document.getElementById('exercises-container');

        function renderExercises(filteredExercises) {
            container.innerHTML = ''; 
            if (filteredExercises.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 text-xl">لا توجد تمارين في هذا التصنيف حالياً</p>`;
                return;
            }

            filteredExercises.forEach(ex => {
                const splitColor = ex.split === 'Push' ? 'bg-blue-900 text-blue-200' : 
                                   ex.split === 'Pull' ? 'bg-red-900 text-red-200' : 
                                   ex.split === 'Legs' ? 'bg-purple-900 text-purple-200' : 'bg-gray-700 text-gray-200';
                
                const eqColor = ex.equipment === 'barbell' ? 'bg-orange-900 text-orange-200' :
                                ex.equipment === 'dumbbell' ? 'bg-teal-900 text-teal-200' :
                                ex.equipment === 'machine' ? 'bg-indigo-900 text-indigo-200' : 'bg-gray-600 text-gray-200';

                const card = `
                    <div class="card-hover bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg">
                        <div class="img-bg h-60 overflow-hidden">
                            ${ex.image ? `<img src="${ex.image}" alt="${ex.name}" class="w-full h-full object-contain" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <span class="text-gray-600 text-6xl absolute hidden">🏋️</span>` : `<span class="text-gray-600 text-6xl">🏋️</span>`}
                        </div>
                        <div class="p-5">
                            <h3 class="text-lg font-bold text-green-400 mb-2 capitalize">${ex.name}</h3>
                            <div class="flex flex-wrap gap-2 mb-3 text-xs capitalize">
                                ${ex.split !== 'Other' ? `<span class="px-2 py-1 rounded ${splitColor}">${ex.split}</span>` : ''}
                                <span class="px-2 py-1 rounded ${eqColor}">${ex.equipment}</span>
                                <span class="px-2 py-1 rounded bg-gray-600 text-gray-200">${ex.muscle}</span>
                            </div>
                            <p class="text-gray-400 text-sm leading-relaxed">${ex.desc}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterExercises(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if (category === 'All') {
                renderExercises(allExercises);
            } else {
                // فلترة حسب نظام التدريب أو نوع الجهاز
                const filtered = allExercises.filter(ex => 
                    ex.split.toLowerCase() === category.toLowerCase() || 
                    ex.equipment.toLowerCase() === category.toLowerCase()
                );
                renderExercises(filtered);
            }
        }

        // تشغيل أول مرة
        loadExercises();
    </script>
</body>
</html>
