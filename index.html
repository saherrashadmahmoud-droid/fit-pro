<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- هذا السطر يحل مشكلة ظهور الصور -->
    <meta name="referrer" content="no-referrer">
    <title>Ultimate Gym Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .filter-btn.active { background-color: #10b981; color: #000; } /* لون الزرار النشط */
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-black/50 backdrop-blur-md sticky top-0 z-10 border-b border-gray-800">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-black text-green-400">ULTIMATE GYM</h1>
            <span class="text-sm text-gray-400 hidden md:block">منصة التمارين والأنظمة المتكاملة</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="text-center py-10 px-4 bg-gradient-to-b from-gray-900 to-gray-800">
        <h2 class="text-3xl md:text-4xl font-bold mb-2">اختر نظامك وتمرن صح</h2>
        <p className="text-gray-400 text-lg">مكتبة شاملة لكل التمارين بصور متحركة (GIFs) لشرح الأداء الصحيح</p>
    </section>

    <!-- Filters -->
    <div class="container mx-auto px-4 py-6 flex flex-wrap justify-center gap-3">
        <button onclick="filterExercises('All', this)" class="filter-btn active px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 font-bold transition">الكل</button>
        
        <span class="text-gray-600 self-center">|</span>
        
        <button onclick="filterExercises('Push', this)" class="filter-btn px-4 py-2 rounded-lg bg-blue-900 hover:bg-blue-800 font-bold transition">بوش (Push)</button>
        <button onclick="filterExercises('Pull', this)" class="filter-btn px-4 py-2 rounded-lg bg-red-900 hover:bg-red-800 font-bold transition">بول (Pull)</button>
        <button onclick="filterExercises('Legs', this)" class="filter-btn px-4 py-2 rounded-lg bg-purple-900 hover:bg-purple-800 font-bold transition">ليج (Legs)</button>
        
        <span class="text-gray-600 self-center">|</span>
        
        <button onclick="filterExercises('Barbell', this)" class="filter-btn px-4 py-2 rounded-lg bg-orange-900 hover:bg-orange-800 font-bold transition">بار</button>
        <button onclick="filterExercises('Dumbbell', this)" class="filter-btn px-4 py-2 rounded-lg bg-teal-900 hover:bg-teal-800 font-bold transition">دمبل</button>
        <button onclick="filterExercises('Machine', this)" class="filter-btn px-4 py-2 rounded-lg bg-indigo-900 hover:bg-indigo-800 font-bold transition">جهاز</button>
        <button onclick="filterExercises('Bodyweight', this)" class="filter-btn px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-bold transition">وزن جسم</button>
    </div>

    <!-- Exercises Grid -->
    <div id="exercises-container" class="container mx-auto px-4 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <footer class="text-center py-6 text-gray-600 border-t border-gray-800">
        <p>© Ultimate Gym Platform - Designed by The Best Coach & Coder</p>
    </footer>

    <script>
        // مكتبة التمارين الضخمة (تقدر تضيف عليها براحتك)
        const exercises = [
            // =============== نظام البوش (PUSH) ===============
            {
                name: "Bench Press (ضغط بنش بالبار)",
                split: "Push", equipment: "Barbell", muscle: "صدر / ترايسبس / كتف",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Barbell-Bench-Press.gif",
                desc: "نام على البنش، امسك البار بقبضة أعرض من الكتفين، انزل بالبار لحد الصدر واطلع تاني بدون قفل المفصل بالكامل."
            },
            {
                name: "Incline Dumbbell Press (صدر علوي دمبل)",
                split: "Push", equipment: "Dumbbell", muscle: "صدر علوي",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Incline-Dumbbell-Press.gif",
                desc: "اضبط البنش على زاوية 30-45 درجة. امسك الدمبلز واطلعهم لأعلى حتى يقتربوا من بعض، وانزل ببطء لتحت مستوى الصدر."
            },
            {
                name: "Overhead Press (كتف بالبار)",
                split: "Push", equipment: "Barbell", muscle: "كتف (أمامي وجانبي)",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Barbell-Shoulder-Press.gif",
                desc: "قف باستقامة، امسك البار بعرض الكتف، ارفع البار لأعلى حتى تستقيم يديك، وانزل لحد مستوى الذقن."
            },
            {
                name: "Dumbbell Shoulder Press (كتف بالدمبل)",
                split: "Push", equipment: "Dumbbell", muscle: "كتف",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Dumbbell-Shoulder-Press.gif",
                desc: "اقعد على بنش بظهر مستقيم، ابدأ بالدمبلز عند مستوى الأذن، واطلعهم لأعلى حتى تقترب من بعضها."
            },
            {
                name: "Lateral Raises (رفرفة جانبي بالدمبل)",
                split: "Push", equipment: "Dumbbell", muscle: "كتف جانبي",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Dumbbell-Lateral-Raise.gif",
                desc: "قف وظهرك مستقيم، امسك الدمبلز جنب جسمك، ارفعهم جانباً لحد ما يكونوا بمستوى الكتف، نزل ببطء."
            },
            {
                name: "Triceps Pushdown (ترايسبس بالكابل)",
                split: "Push", equipment: "Machine", muscle: "ترايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Lat-Pulldown-Triangle-V-Bar.gif",
                desc: "قف أمام الجهاز، الكوع ثابت جنب جسمك، اسحب البار لأسفل لحد آخر مدى وارجع ببطء."
            },
            {
                name: "Dips (ديبس)",
                split: "Push", equipment: "Bodyweight", muscle: "صدر سفلي / ترايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Triceps-Dips.gif",
                desc: "امسك المتوازي، انزل بجسمك لحد ما الكوع يكون 90 درجة، واطلع بتركيز على الترايسبس والصدر."
            },

            // =============== نظام البول (PULL) ===============
            {
                name: "Deadlift (رفعة ميتة بالبار)",
                split: "Pull", equipment: "Barbell", muscle: "ظهر / جلوتس / أمام فخذ",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Barbell-Deadlift.gif",
                desc: "قف وسط البار، انزل بوركك للوراء، امسك البار، واطلع واقفاً بثقل الركبتين والورك معاً، ظهرك مستقيم."
            },
            {
                name: "Pull-ups (عقلة)",
                split: "Pull", equipment: "Bodyweight", muscle: "ظهر عرضي / بايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Pull-ups.gif",
                desc: "امسك البار بقبضة واسعة، اسحب جسمك للأعلى لحد ذقنك يعدى البار، وانزل ببطء."
            },
            {
                name: "Barbell Row (تجديف بالبار)",
                split: "Pull", equipment: "Barbell", muscle: "ظهر سميك",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Bent-Over-Row.gif",
                desc: "انحني للأمام بظهر مستقيم، امسك البار، اسحبه لأسفل الصدر، وارجعه للأسفل ببطء."
            },
            {
                name: "Lat Pulldown (سحب أمامي بالكابل)",
                split: "Pull", equipment: "Machine", muscle: "ظهر عرضي",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Lat-Pulldown.gif",
                desc: "اجلس على الجهاز، امسك البار بقبضة واسعة، اسحب لأسفل لحد يلمس صدرك العلوي وركز على ضغط ظهرك."
            },
            {
                name: "Seated Cable Row (تجديف بالكابل من جلوس)",
                split: "Pull", equipment: "Machine", muscle: "ظهر سميك",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Seated-Cable-Rows.gif",
                desc: "اجلس، ميل للخلف شوية، اسحب المقبض لحد بطنك، وافرد ظهرك للأمام ببطء مع الحفاظ على استقامة الظهر."
            },
            {
                name: "Dumbbell Bicep Curl (بايسبس بالدمبل)",
                split: "Pull", equipment: "Dumbbell", muscle: "بايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Dumbbell-Biceps-Curl.gif",
                desc: "قف باستقامة، امسك الدمبلز، ارفعهم مع تثبيت الكوع جنب جسمك، ركز على انقباض البايسبس."
            },
            {
                name: "Hammer Curl (مطرقة بالدمبل)",
                split: "Pull", equipment: "Dumbbell", muscle: "بايسبس / ساعد",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Hammer-Curl.gif",
                desc: "نفس تمرين البايسبس بس القبضة تكون محايدة (كأنك تمسك مطرقة)، ده بيستهدف الساعد والعضلة العضدية."
            },

            // =============== نظام الليج (LEGS) ===============
            {
                name: "Barbell Squat (سكوات بالبار)",
                split: "Legs", equipment: "Barbell", muscle: "أمام فخذ / جلوتس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Barbell-Back-Squat.gif",
                desc: "حط البار على الترابيس، نزل ببطء لحد ما فخدك يوازي الأرض، اعكس الحركة واطلع بدون قفل الركبة."
            },
            {
                name: "Leg Press (ضغط أرجل بالجهاز)",
                split: "Legs", equipment: "Machine", muscle: "أمام فخذ / مؤخرة فخذ",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Leg-Press.gif",
                desc: "اجلس على الجهاز، حط رجليك على المنصة بعرض الكتف، انزل ببطء لحد ما الركبة تكون 90 درجة، واطلع."
            },
            {
                name: "Romanian Deadlift (رفعة ميتة رومانية)",
                split: "Legs", equipment: "Barbell", muscle: "مؤخرة فخذ / جلوتس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Romanian-Deadlift.gif",
                desc: "امسك البار قدام فخدك، انزل بالبار على طول فخدك لتحت الركبة مع دفع الورك للخلف، ظهرك مستقيم."
            },
            {
                name: "Dumbbell Lunges (الطعنة بالدمبل)",
                split: "Legs", equipment: "Dumbbell", muscle: "أمام فخذ / جلوتس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Dumbbell-Lunges.gif",
                desc: "قف ممسكاً الدمبلز، خطوة خطوة للأمام، انزل بجسمك لحد ما الركبة الخلفية تقرب من الأرض، وارجع."
            },
            {
                name: "Leg Extensions (تمديد أرجل بالجهاز)",
                split: "Legs", equipment: "Machine", muscle: "أمام فخذ (Quads)",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Leg-Extensions.gif",
                desc: "اجلس على الجهاز، حط رجليك تحت الباد، وافرد رجليك بالكامل للأمام مع تثبيت جسمك على الكرسي."
            },
            {
                name: "Lying Leg Curls (ثني أرجل بالجهاز نوم)",
                split: "Legs", equipment: "Machine", muscle: "مؤخرة فخذ (Hamstrings)",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Lying-Leg-Curls.gif",
                desc: "نام على الجهاز، حط عقلك تحت الباد، ثني رجليك لحد ما الباد يلمس مؤخرتك، وانزل ببطء."
            },
            {
                name: "Standing Calf Raises (ربلة واقف)",
                split: "Legs", equipment: "Machine", muscle: "سمانة (Calf)",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Standing-Calf-Raises.gif",
                desc: "قف على الجهاز، انزل بجسمك لتحت لحد آخر مدى للربلة، واطلع بتركيز على انقباض العضلة."
            }
        ];

        const container = document.getElementById('exercises-container');

        function renderExercises(filteredExercises) {
            container.innerHTML = ''; 
            
            if (filteredExercises.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 text-xl">لا توجد تمارين في هذا التصنيف حالياً</p>`;
                return;
            }

            filteredExercises.forEach(ex => {
                const splitColor = ex.split === 'Push' ? 'bg-blue-900 text-blue-200' : 
                                   ex.split === 'Pull' ? 'bg-red-900 text-red-200' : 'bg-purple-900 text-purple-200';
                
                const eqColor = ex.equipment === 'Barbell' ? 'bg-orange-900 text-orange-200' :
                                ex.equipment === 'Dumbbell' ? 'bg-teal-900 text-teal-200' :
                                ex.equipment === 'Machine' ? 'bg-indigo-900 text-indigo-200' : 'bg-gray-700 text-gray-200';

                const card = `
                    <div class="card-hover bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg">
                        <div class="bg-gray-700 h-60 flex items-center justify-center overflow-hidden">
                            <img src="${ex.image}" alt="${ex.name}" class="w-full h-full object-cover" loading="lazy"
                                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300/1f2937/9ca3af?text=Image+Not+Found';">
                        </div>
                        <div class="p-5">
                            <h3 class="text-xl font-bold text-green-400 mb-2">${ex.name}</h3>
                            <div class="flex flex-wrap gap-2 mb-3 text-xs">
                                <span class="px-2 py-1 rounded ${splitColor}">${ex.split}</span>
                                <span class="px-2 py-1 rounded ${eqColor}">${ex.equipment}</span>
                                <span class="px-2 py-1 rounded bg-gray-600 text-gray-200">${ex.muscle}</span>
                            </div>
                            <p class="text-gray-400 text-sm leading-relaxed">${ex.desc}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterExercises(category, btn) {
            // تحديث شكل الأزرار النشطة
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if (category === 'All') {
                renderExercises(exercises);
            } else {
                const filtered = exercises.filter(ex => ex.split === category || ex.equipment === category);
                renderExercises(filtered);
            }
        }

        // تشغيل أول مرة
        renderExercises(exercises);
    </script>
</body>
</html>
