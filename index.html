<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gym Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-black/50 backdrop-blur-md sticky top-0 z-10 border-b border-gray-800">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-black text-green-400">ULTIMATE GYM</h1>
            <span class="text-sm text-gray-400 hidden md:block">منصة التمارين والأنظمة المتكاملة</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="text-center py-10 px-4 bg-gradient-to-b from-gray-900 to-gray-800">
        <h2 class="text-3xl md:text-4xl font-bold mb-2">اختر نظامك وتمرن صح</h2>
        <p className="text-gray-400 text-lg">تمارين بصور متحركة (GIFs) لشرح الأداء الصحيح بالبار، الدمبل، والأجهزة</p>
    </section>

    <!-- Filters -->
    <div class="container mx-auto px-4 py-6 flex flex-wrap justify-center gap-3">
        <button onclick="filterExercises('All')" class="filter-btn px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 font-bold transition">الكل</button>
        
        <span class="text-gray-600 self-center">|</span>
        
        <button onclick="filterExercises('Push')" class="filter-btn px-4 py-2 rounded-lg bg-blue-900 hover:bg-blue-800 font-bold transition">بوش (Push)</button>
        <button onclick="filterExercises('Pull')" class="filter-btn px-4 py-2 rounded-lg bg-red-900 hover:bg-red-800 font-bold transition">بول (Pull)</button>
        <button onclick="filterExercises('Legs')" class="filter-btn px-4 py-2 rounded-lg bg-purple-900 hover:bg-purple-800 font-bold transition">ليج (Legs)</button>
        
        <span class="text-gray-600 self-center">|</span>
        
        <button onclick="filterExercises('Barbell')" class="filter-btn px-4 py-2 rounded-lg bg-orange-900 hover:bg-orange-800 font-bold transition">بار</button>
        <button onclick="filterExercises('Dumbbell')" class="filter-btn px-4 py-2 rounded-lg bg-teal-900 hover:bg-teal-800 font-bold transition">دمبل</button>
        <button onclick="filterExercises('Machine')" class="filter-btn px-4 py-2 rounded-lg bg-indigo-900 hover:bg-indigo-800 font-bold transition">جهاز</button>
        <button onclick="filterExercises('Bodyweight')" class="filter-btn px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-bold transition">وزن جسم</button>
    </div>

    <!-- Exercises Grid -->
    <div id="exercises-container" class="container mx-auto px-4 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- The cards will be injected here by JavaScript -->
    </div>

    <footer class="text-center py-6 text-gray-600 border-t border-gray-800">
        <p>© Ultimate Gym Platform - Designed by The Best Coach & Coder</p>
    </footer>

    <script>
        // قاعدة بيانات التمارين (تقدر تضيف عليها براحتك)
        const exercises = [
            {
                name: "Bench Press (ضغط بنش بالبار)",
                split: "Push",
                equipment: "Barbell",
                muscle: "صدر / ترايسبس / كتف أمامي",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Barbell-Bench-Press.gif",
                desc: "نام على البنش، امسك البار بقبضة أعرض من الكتفين شوية، انزل بالبار لحد الصدر واطلع تاني بدون قفل المفصل بالكامل."
            },
            {
                name: "Dumbbell Bicep Curl (بايسبس بالدمبل)",
                split: "Pull",
                equipment: "Dumbbell",
                muscle: "بايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Dumbbell-Biceps-Curl.gif",
                desc: "قف باستقامة، امسك الدمبلز، ارفعهم مع تثبيت الكوع جنب جسمك، ركز على انقباض البايسبس ونزل ببطء."
            },
            {
                name: "Lat Pulldown (سحب أمامي بالكابل)",
                split: "Pull",
                equipment: "Machine",
                muscle: "ظهر عرضي / بايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Lat-Pulldown.gif",
                desc: "اجلس على الجهاز، امسك البار بقبضة واسعة، اسحب لأسفل لحد ما يلمس صدرك العلوي وركز على ضغط ظهرك."
            },
            {
                name: "Barbell Squat (سكوات بالبار)",
                split: "Legs",
                equipment: "Barbell",
                muscle: "أمام فخذ / مؤخرة فخذ / جلوتس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Barbell-Back-Squat.gif",
                desc: "حط البار على الترابيس، نزل ببطء لحد ما فخدك يوازي الأرض، اعكس الحركة واطلع بدون قفل الركبة بالكامل."
            },
            {
                name: "Push Ups (ضغط أرضي)",
                split: "Push",
                equipment: "Bodyweight",
                muscle: "صدر / ترايسبس / كتف",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Push-up.gif",
                desc: "استند على كفوفك وأصابع رجليك، حافظ على استقامة ظهرك، انزل بصدرك لحد قرب الأرض واطلع."
            },
            {
                name: "Leg Extension (تمديد أرجل بالجهاز)",
                split: "Legs",
                equipment: "Machine",
                muscle: "أمام فخذ (Quads)",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Leg-Extensions.gif",
                desc: "اجلس على الجهاز، حط رجليك تحت الباد، وافرد رجليك بالكامل للأمام مع تثبيت جسمك على الكرسي."
            },
            {
                name: "Triceps Pushdown (ترايسبس بالكابل)",
                split: "Push",
                equipment: "Machine",
                muscle: "ترايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Lat-Pulldown-Triangle-V-Bar.gif",
                desc: "قف أمام الجهاز، الكوع ثابت جنب جسمك، اسحب البار لأسفل لحد آخر مدى وارجع ببطء."
            },
            {
                name: "Dumbbell Shoulder Press (كتف بالدمبل)",
                split: "Push",
                equipment: "Dumbbell",
                muscle: "كتف (أمامي وجانبي)",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Dumbbell-Shoulder-Press.gif",
                desc: "اقعد على بنش بظهر مستقيم، ابدأ بالدمبلز عند مستوى الأذن، واطلعهم لأعلى حتى تقترب من بعضها."
            },
             {
                name: "Pull-ups (عقلة)",
                split: "Pull",
                equipment: "Bodyweight",
                muscle: "ظهر عرضي / بايسبس",
                image: "https://fitnessprogramer.com/wp-content/uploads/2021/04/Pull-ups.gif",
                desc: "امسك البار بقبضة واسعة، اسحب جسمك لالأعلى لحد ذقنك يعدى البار، وانزل ببطء بدون تهز جسمك."
            }
        ];

        // دالة عرض التمارين
        const container = document.getElementById('exercises-container');

        function renderExercises(filteredExercises) {
            container.innerHTML = ''; // تفريغ الحاوية
            
            if (filteredExercises.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 text-xl">لا توجد تمارين في هذا التصنيف حالياً</p>`;
                return;
            }

            filteredExercises.forEach(ex => {
                // تحديد ألوان التاجز (Tags) حسب النوع
                const splitColor = ex.split === 'Push' ? 'bg-blue-900 text-blue-200' : 
                                   ex.split === 'Pull' ? 'bg-red-900 text-red-200' : 'bg-purple-900 text-purple-200';
                
                const eqColor = ex.equipment === 'Barbell' ? 'bg-orange-900 text-orange-200' :
                                ex.equipment === 'Dumbbell' ? 'bg-teal-900 text-teal-200' :
                                ex.equipment === 'Machine' ? 'bg-indigo-900 text-indigo-200' : 'bg-gray-700 text-gray-200';

                const card = `
                    <div class="card-hover bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg">
                        <div class="bg-gray-700 h-60 flex items-center justify-center overflow-hidden">
                            <img src="${ex.image}" alt="${ex.name}" class="w-full h-full object-cover" 
                                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300/1f2937/9ca3af?text=Ultimate+Gym';">
                        </div>
                        <div class="p-5">
                            <h3 class="text-xl font-bold text-green-400 mb-2">${ex.name}</h3>
                            <div class="flex flex-wrap gap-2 mb-3 text-xs">
                                <span class="px-2 py-1 rounded ${splitColor}">${ex.split}</span>
                                <span class="px-2 py-1 rounded ${eqColor}">${ex.equipment}</span>
                                <span class="px-2 py-1 rounded bg-gray-600 text-gray-200">${ex.muscle}</span>
                            </div>
                            <p class="text-gray-400 text-sm leading-relaxed">${ex.desc}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // دالة الفلترة
        function filterExercises(category) {
            if (category === 'All') {
                renderExercises(exercises);
            } else {
                const filtered = exercises.filter(ex => ex.split === category || ex.equipment === category);
                renderExercises(filtered);
            }
        }

        // تشغيل الموقع لأول مرة وعرض كل التمارين
        renderExercises(exercises);
    </script>
</body>
</html>
